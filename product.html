  <body class="shop-page">
    <a class="skip-link" href="#main">Mahsulotga o‘tish</a>
    <header class="site-header" id="site-header">
      <div class="shop-brand-group">
        <button class="menu-toggle icon-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menyuni ochish" title="Menyu"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#menu" /></svg></button>

      <p class="header-caption">Sport va kundalik uslub</p>
      <div class="header-actions">
        <div class="account" id="account" data-next="" hidden></div>
        <button class="cart-toggle" type="button" aria-controls="cart-drawer" aria-label="Savatchani ochish, 0 ta mahsulot"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#shopping-bag" /></svg><span>Savatcha</span><b class="cart-count" aria-hidden="true">0</b></button>

    <div class="shop-layout">
      <button class="menu-backdrop" type="button" data-menu-close aria-label="Menyuni yopish" hidden></button>
      <aside class="shop-sidebar" id="site-nav" aria-label="Do‘kon navigatsiyasi">

          <a href="/#store"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#map-pin" /></svg>Do‘kon manzili</a>

        <div class="sidebar-bottom">

          <a class="sidebar-contact" href="https://www.instagram.com/neosport_namangan/" target="_blank" rel="noopener noreferrer" data-analytics-location="footer" data-analytics-destination="instagram"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#instagram" /></svg><span>Instagram<small>@neosport_namangan</small></span><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#arrow-up-right" /></svg></a>

          <div class="product-detail-loading" aria-hidden="true"><div></div><span></span><span></span><span></span></div>
